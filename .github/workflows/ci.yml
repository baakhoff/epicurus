name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits to scan the diff

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        # What gets checked lives in [tool.mypy] `files` in pyproject.toml — every
        # package's `src` *and* its `tests`.
        run: uv run mypy

      - name: Tests
        run: uv run pytest
        env:
          # Integration tests manage their own container lifecycle; the reaper
          # is unnecessary on ephemeral CI runners and avoids flakiness.
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (includes tsc type-check)
        run: npm run build

      - name: Tests
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the assembled compose stack
        run: docker compose -f compose.yaml config -q

      # The default invocation above resolves every service regardless of profile, but
      # doesn't prove the observability fragment (infra/observability/compose.yaml, gated
      # behind `profiles: [observability]` — see infra/observability/compose.yaml and the
      # observability-lint job below) actually activates cleanly under its own profile.
      # `--profile` changes what `up`/`config` *select*, which can surface profile-specific
      # interpolation issues the unfiltered run wouldn't.
      - name: Validate the assembled compose stack (observability profile)
        run: docker compose -f compose.yaml --profile observability config -q

  # The Helm chart gets the same treatment the compose stack does: rendered, then
  # checked. `helm lint` catches template errors, `helm template` proves the branches
  # render at all, and `kubeconform -strict` validates the result against the real
  # Kubernetes API schemas — which is what catches a misspelled field or a wrong
  # apiVersion that YAML-level linting cannot see. Two renders, because the optional
  # surfaces (ingress, MinIO, NetworkPolicy, PodMonitor) are exactly where a template
  # bug hides. The PodMonitor is a kube-prometheus-stack CRD with no built-in schema,
  # so the second run adds the CRDs-catalog schema location rather than skipping it
  # (a skip would validate nothing and still report success).
  #
  # No cluster is booted here: a kind-based k8s-smoke, mirroring infra/ci/smoke.sh's
  # assertions, is #894.
  chart-validate:
    runs-on: ubuntu-latest
    env:
      CHART: infra/k8s/epicurus
      HELM_VERSION: "3.16.4"
      KUBECONFORM_VERSION: "0.6.7"
      # Oldest Kubernetes the chart claims to support (Chart.yaml kubeVersion).
      KUBE_VERSION: "1.25.0"
      CRD_SCHEMAS: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm and kubeconform (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          tar xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tgz
          tar xzf kubeconform.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v

      - name: Lint the chart
        run: helm lint "$CHART"

      - name: Render and validate — default values
        run: |
          helm template epicurus "$CHART" \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" -

      - name: Render and validate — ingress, MinIO, NetworkPolicy, PodMonitor
        run: |
          helm template epicurus "$CHART" \
            --set ingress.enabled=true,minio.enabled=true,networkPolicy.enabled=true,metrics.podMonitor.enabled=true \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                -schema-location default -schema-location "$CRD_SCHEMAS" -

      # The optional pieces turned OFF, and the data plane pointed at managed
      # services — the homelab default renders one way, a real cluster the
      # other, and neither may break. Without this the "off" branch of every
      # `if .Values.<x>.enabled` guard would go unrendered.
      - name: Render and validate — optional pieces off, data plane external
        run: |
          helm template epicurus "$CHART" \
            --set minio.enabled=false \
            --set ollama.enabled=false,ollama.external.url=http://ollama.example.com:11434 \
            --set postgres.enabled=false,postgres.external.host=pg.example.com \
            --set nats.enabled=false,nats.external.url=nats://nats.example.com:4222 \
            --set qdrant.enabled=false,qdrant.external.url=http://qdrant.example.com:6333 \
            --set searxng.enabled=false,searxng.external.url=http://searx.example.com:8080 \
            | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" -

  # Validates Prometheus and Alertmanager configs without booting the
  # observability stack. The runtime-smoke gate skips that stack, so a bad rule
  # (e.g. an undefined template function) would otherwise reach production
  # before being caught. See issue #153 and the regression in #152.
  observability-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Prometheus config and rules
        run: |
          # prom/prometheus' entrypoint is `prometheus`; override it to run promtool.
          # Mount at /etc/prometheus so the config's absolute rule_files glob
          # (/etc/prometheus/rules/*.yml) resolves during `check config`.
          docker run --rm --entrypoint=promtool \
            -v "${{ github.workspace }}/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=promtool \
            -v "${{ github.workspace }}/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 \
            check rules /etc/prometheus/rules/epicurus-alerts.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm --entrypoint=amtool \
            -v "${{ github.workspace }}/infra/observability/alertmanager:/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /alertmanager/alertmanager.yml

  # No shell script was ever parsed by a POSIX shell before this gate: #675 shipped a bash
  # array in a script whose every documented invocation is `sh` (dash on the deploy box), and
  # every existing check — including local testing — used Git Bash's `sh`, which *is* bash, so
  # the parse error was invisible everywhere but the actual deploy box (#691). shellcheck ships
  # preinstalled on the `ubuntu-latest` runner image; the shell it lints each script against is
  # inferred from that script's own shebang (never hardcoded), so a new *.sh is covered the
  # moment it's added — discovered via `git ls-files`, not a hardcoded list.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck every script, shell inferred from its shebang
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            interpreter="$(head -1 "$f" | awk '{
              sub(/^#! */, "")
              n = split($0, parts, " ")
              split(parts[n], segs, "/")
              print segs[length(segs)]
            }')"
            case "$interpreter" in
              sh | bash | dash | ksh | busybox) ;;
              *)
                echo "::error file=$f::unrecognized shebang interpreter '$interpreter' — add it to this job's shell mapping"
                status=1
                continue
                ;;
            esac
            echo "::group::shellcheck --shell=$interpreter $f"
            shellcheck --shell="$interpreter" "$f" || status=1
            echo "::endgroup::"
          done < <(git ls-files -z '*.sh')
          exit "$status"

  # #661 existed because a docs page path was referenced from shipped operator-facing UI copy
  # and a compose comment while the page it named didn't exist in the public tree — nothing
  # caught it, and a generic markdown-link checker wouldn't catch the next one either; it
  # never looks inside a .tsx or a compose comment (#692). scripts/check_docs_links.py checks
  # (1) every relative link between docs pages, anchors included, and (2) repo-relative doc
  # paths quoted in shipped source (web UI copy, compose comments, other top-level READMEs,
  # .env.example). Stdlib-only — no uv sync needed.
  docs-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check docs/ links, anchors, and source references
        run: python3 scripts/check_docs_links.py

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build service images (validate Dockerfiles)
        run: |
          for df in services/*/Dockerfile; do
            svc="$(basename "$(dirname "$df")")"
            echo "::group::build $svc"
            docker build -f "$df" -t "epicurus-$svc:ci" .
            echo "::endgroup::"
          done

  # Boots the actual stack (data plane + OpenBao bootstrap + core + modules) and
  # asserts the integration last mile that the jobs above never exercise: module
  # discovery, status reachability through core, an MCP tool round-trip, and a
  # secret surviving a vault restart. See infra/ci/smoke.sh and #98.
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the stack and smoke-test the integration last mile
        run: sh infra/ci/smoke.sh
