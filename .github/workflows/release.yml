name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The first release is v0.1.0 — the first version usable on a server with a UI.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write

jobs:
  # Build and push images first so they exist on GHCR before the GH Release
  # is published. A GH Release without corresponding images is misleading.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push service images to GHCR
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          for df in services/*/Dockerfile; do
            svc="$(basename "$(dirname "$df")")"
            img="ghcr.io/${owner}/epicurus-${svc}"
            echo "::group::build + push ${svc}"
            docker build -f "$df" -t "${img}:${version}" -t "${img}:latest" .
            docker push "${img}:${version}"
            docker push "${img}:latest"
            echo "::endgroup::"
          done

  # Package and publish the Helm chart beside the images, as an OCI artifact —
  # no-op-safe (every step past checkout is guarded) so this job stays green
  # whether or not infra/k8s/epicurus/Chart.yaml has landed yet (#890).
  chart:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        if: hashFiles('infra/k8s/epicurus/Chart.yaml') != ''
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart to GHCR
        if: hashFiles('infra/k8s/epicurus/Chart.yaml') != ''
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package infra/k8s/epicurus --version "${version}" --app-version "${version}" -d /tmp/charts
          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io -u "${HELM_REGISTRY_USER}" --password-stdin
          helm push "/tmp/charts/epicurus-${version}.tgz" "oci://ghcr.io/${owner}/charts"

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE
