name: Testing images

# Continuous deploy of the `testing` branch — NOT a release.
#
# Every push to `testing` rebuilds the service images and pushes them to GHCR
# under the moving `:testing` tag. A box with `EPICURUS_VERSION=testing` in its
# `.env` then pulls the branch HEAD on its next reconcile (see
# docs/infrastructure/auto-deploy.md). No version tag and no GitHub Release are
# created — this track is for the maintainer's own always-on box, ahead of the
# semver releases cut by release.yml.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to testing supersedes an in-flight build — don't pile up images.
concurrency:
  group: testing-images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push :testing images to GHCR
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          for df in services/*/Dockerfile; do
            svc="$(basename "$(dirname "$df")")"
            img="ghcr.io/${owner}/epicurus-${svc}"
            echo "::group::build + push ${svc}:testing"
            docker build -f "$df" -t "${img}:testing" .
            docker push "${img}:testing"
            echo "::endgroup::"
          done

  # Package and publish the Helm chart beside the :testing images, as an OCI
  # artifact tagged to this commit — no-op-safe (every step past checkout is
  # guarded) so this job stays green whether or not
  # infra/k8s/epicurus/Chart.yaml has landed yet (#890).
  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        if: hashFiles('infra/k8s/epicurus/Chart.yaml') != ''
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart to GHCR
        if: hashFiles('infra/k8s/epicurus/Chart.yaml') != ''
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          version="0.0.0-testing.${GITHUB_SHA:0:7}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package infra/k8s/epicurus --version "${version}" --app-version testing -d /tmp/charts
          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io -u "${HELM_REGISTRY_USER}" --password-stdin
          helm push "/tmp/charts/epicurus-${version}.tgz" "oci://ghcr.io/${owner}/charts"
