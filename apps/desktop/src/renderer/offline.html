<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server not reachable — Epicurus</title>
    <link rel="stylesheet" href="style.css" />
    <script src="offline.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1 id="title">Server not reachable</h1>
        <p id="message">The server could not be reached.</p>
        <p>Server: <span class="host" id="server"></span></p>
        <div class="row">
          <button type="button" id="change">Change server</button>
          <button type="button" class="primary" id="retry">Retry</button>
        </div>
      </section>
    </main>
  </body>
</html>
