{{- if .Values.hermarchus.enabled }}
{{- /*
  Hermarchus, the agent host (#1016) — off by default. A singleton: its three volumes are
  ReadWriteOnce and its SQLite spool is single-writer, so Recreate, never two pods at once.
  It needs no Kubernetes API access at all: no ServiceAccount token is mounted.
*/}}
{{- $h := .Values.hermarchus -}}
{{- $secretName := default "hermarchus" $h.existingSecret -}}
{{- if not $h.existingSecret }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace "hermarchus") -}}
{{- $token := $h.token -}}
{{- if and (not $token) $live (hasKey $live.data "token") -}}
{{- $token = index $live.data "token" | b64dec -}}
{{- end -}}
{{- if not $token -}}{{- $token = randAlphaNum 48 -}}{{- end -}}
{{- if lt (len $token) 16 -}}
{{- fail "hermarchus.token must be at least 16 characters (Hermarchus refuses a shorter one)" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: hermarchus
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "hermarchus") | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
{{- end }}
{{- range $name := list "workspace" "home" "state" }}
{{- $p := index $h.persistence $name }}
{{- if not $p.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermarchus-{{ $name }}
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "hermarchus") | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $p.size }}
  {{- include "epicurus.storageClass" (dict "ctx" $ "class" $p.storageClass) | nindent 2 }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: hermarchus
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "hermarchus") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "hermarchus") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermarchus
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "hermarchus") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "hermarchus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "epicurus.labels" (dict "ctx" $ "component" "hermarchus") | nindent 8 }}
        epicurus.io/metrics: "true"
{{- $podAnnotations := merge (dict) $h.podAnnotations (include "epicurus.metricsAnnotations" $ | fromYaml) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "epicurus.imagePullSecrets" $) }}{{ nindent 6 . }}{{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $h.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Agents get SIGTERM'd with a grace of their own on shutdown; leave room for it.
      terminationGracePeriodSeconds: 30
      containers:
        - name: hermarchus
          image: {{ include "epicurus.image" (dict "ctx" $ "name" "hermarchus" "override" $h.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with $h.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HERMARCHUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: token
            - name: HERMARCHUS_PROFILE
              value: {{ default .Values.defaultTenantId $h.profile | quote }}
            - name: HERMARCHUS_MAX_SESSIONS
              value: {{ $h.maxSessions | quote }}
            - name: HERMARCHUS_UNATTENDED
              value: {{ $h.unattended | quote }}
            - name: HERMARCHUS_INSTALL_KINDS
              value: {{ $h.installKinds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | default "info" | quote }}
            {{- range $k, $v := $h.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/hermarchus
            - name: state
              mountPath: /state
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with $h.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- range $name := list "workspace" "home" "state" }}
        {{- $p := index $h.persistence $name }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ default (printf "hermarchus-%s" $name) $p.existingClaim }}
        {{- end }}
      {{- with $h.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
