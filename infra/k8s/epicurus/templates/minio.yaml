{{- if .Values.minio.enabled }}
{{- $p := .Values.minio.persistence }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "minio") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
  selector:
    {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "minio") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "minio") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "epicurus.labels" (dict "ctx" $ "component" "minio") | nindent 8 }}
    spec:
      {{- /* No Docker-links env injection anywhere; see _helpers.tpl (#894). */}}
      enableServiceLinks: false
      containers:
        - name: minio
          image: {{ include "epicurus.thirdPartyImage" .Values.minio.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "epicurus.secretName" $ }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "epicurus.secretName" $ }}
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          {{- with .Values.minio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or (not $p.enabled) $p.existingClaim }}
      volumes:
        - name: data
        {{- if $p.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.minio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and $p.enabled (not $p.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $p.size }}
        {{- include "epicurus.storageClass" (dict "ctx" $ "class" $p.storageClass) | nindent 8 }}
  {{- end }}
---
{{- /*
  Seeds the default bucket, the same one-shot compose runs. Per-tenant bucket
  provisioning is the storage module's own concern; this only makes sure it has
  somewhere to write. Revision-named for the same reason the OpenBao bootstrap is
  (a Job's pod template is immutable), and its own component label so a finished
  mc pod can never land in the `minio` Service's EndpointSlice.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ .Release.Revision }}
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "minio-init") | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: {{ .Values.minio.initJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "epicurus.labels" (dict "ctx" $ "component" "minio-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with (include "epicurus.imagePullSecrets" $) }}{{ nindent 6 . }}{{- end }}
      {{- /* No Docker-links env injection anywhere; see _helpers.tpl (#894). */}}
      enableServiceLinks: false
      containers:
        - name: minio-init
          # The mc client is versioned SEPARATELY from the server — never assume
          # they share a release tag.
          image: {{ include "epicurus.thirdPartyImage" .Values.minio.initImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mc alias set local "$MINIO_URL" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for MinIO at $MINIO_URL..."
                sleep 5
              done
              mc mb --ignore-existing "local/$MINIO_DEFAULT_BUCKET"
          env:
            - name: MINIO_URL
              value: {{ include "epicurus.minioUrl" $ | quote }}
            - name: MINIO_DEFAULT_BUCKET
              value: {{ .Values.minio.defaultBucket | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "epicurus.secretName" $ }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "epicurus.secretName" $ }}
                  key: MINIO_ROOT_PASSWORD
{{- end }}
