{{- if .Values.metrics.podMonitor.enabled }}
{{- /*
  For kube-prometheus-stack. The chart re-ships no Prometheus, no rules and no
  dashboards (observability on Kubernetes is #896) — it only makes the pods that
  serve /metrics discoverable. Needs the monitoring.coreos.com CRDs installed.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: epicurus
  {{- with .Values.metrics.podMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "metrics") | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: epicurus
      app.kubernetes.io/instance: {{ .Release.Name }}
      # Only the pods that actually serve /metrics — core-app and the modules.
      # The web shell is nginx and the data plane speaks its own protocols.
      epicurus.io/metrics: "true"
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
{{- end }}
