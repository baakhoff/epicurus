{{- if not .Values.secrets.existingSecret }}
{{- $name := "epicurus-secrets" -}}
{{- /*
  Keep-what-is-there: read the live Secret back before generating anything, so a
  `helm upgrade` never rotates a password out from under a running Postgres or a
  JetStream store. Precedence per key: an explicit value in `secrets.*` wins,
  else the value already in the cluster, else a fresh random one.

  `lookup` returns nothing during `helm template`/`--dry-run` (there is no cluster
  to read), so a rendered diff shows freshly generated values — they are not what
  is deployed. Real credentials are never emitted into a ConfigMap.
*/}}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $data := dict -}}
{{- if $live -}}{{- $data = $live.data -}}{{- end -}}

{{- $pgPassword := .Values.secrets.postgresPassword -}}
{{- if and (not $pgPassword) (hasKey $data "POSTGRES_PASSWORD") -}}
{{- $pgPassword = index $data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $pgPassword -}}{{- $pgPassword = randAlphaNum 32 -}}{{- end -}}

{{- $natsCore := .Values.secrets.natsCorePassword -}}
{{- if and (not $natsCore) (hasKey $data "NATS_CORE_PASSWORD") -}}
{{- $natsCore = index $data "NATS_CORE_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $natsCore -}}{{- $natsCore = randAlphaNum 32 -}}{{- end -}}

{{- $natsModule := .Values.secrets.natsModulePassword -}}
{{- if and (not $natsModule) (hasKey $data "NATS_MODULE_PASSWORD") -}}
{{- $natsModule = index $data "NATS_MODULE_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $natsModule -}}{{- $natsModule = randAlphaNum 32 -}}{{- end -}}

{{- $natsSys := .Values.secrets.natsSysPassword -}}
{{- if and (not $natsSys) (hasKey $data "NATS_SYS_PASSWORD") -}}
{{- $natsSys = index $data "NATS_SYS_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $natsSys -}}{{- $natsSys = randAlphaNum 32 -}}{{- end -}}

{{- $oauthState := .Values.secrets.oauthStateSecret -}}
{{- if and (not $oauthState) (hasKey $data "OAUTH_STATE_SECRET") -}}
{{- $oauthState = index $data "OAUTH_STATE_SECRET" | b64dec -}}
{{- end -}}
{{- if not $oauthState -}}{{- $oauthState = randAlphaNum 64 -}}{{- end -}}

{{- $minioUser := .Values.secrets.minioRootUser -}}
{{- if and (not $minioUser) (hasKey $data "MINIO_ROOT_USER") -}}
{{- $minioUser = index $data "MINIO_ROOT_USER" | b64dec -}}
{{- end -}}
{{- if not $minioUser -}}{{- $minioUser = "epicurus" -}}{{- end -}}

{{- $minioPassword := .Values.secrets.minioRootPassword -}}
{{- if and (not $minioPassword) (hasKey $data "MINIO_ROOT_PASSWORD") -}}
{{- $minioPassword = index $data "MINIO_ROOT_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $minioPassword -}}{{- $minioPassword = randAlphaNum 40 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  NATS_CORE_PASSWORD: {{ $natsCore | b64enc | quote }}
  NATS_MODULE_PASSWORD: {{ $natsModule | b64enc | quote }}
  NATS_SYS_PASSWORD: {{ $natsSys | b64enc | quote }}
  OAUTH_STATE_SECRET: {{ $oauthState | b64enc | quote }}
  MINIO_ROOT_USER: {{ $minioUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | b64enc | quote }}
{{- end }}
