{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "epicurus.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "epicurus.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "epicurus.labels" (dict "ctx" $ "component" "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "epicurus.imagePullSecrets" $) }}{{ nindent 6 . }}{{- end }}
      {{- /* No Docker-links env injection anywhere; see _helpers.tpl (#894). */}}
      enableServiceLinks: false
      containers:
        - name: web
          image: {{ include "epicurus.image" (dict "ctx" $ "name" "web" "override" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # nginxinc/nginx-unprivileged already runs as uid 101 and binds 8080.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Where the shell's nginx proxies /platform/ — the core, on the
            # cluster network. nginx resolves that name through a resolver the
            # image derives from /etc/resolv.conf at start-up (#891, a sibling
            # change that must be in the web image this chart deploys), so the
            # chart sets nothing else for it. Against an older image whose
            # resolver is hardcoded to Docker's 127.0.0.11, every /platform/
            # request 502s while both probes still pass — /healthz is a static
            # handler that never touches the resolver.
            - name: CORE_APP_URL
              value: {{ include "epicurus.platformUrl" $ | quote }}
            {{- range $k, $v := .Values.web.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
