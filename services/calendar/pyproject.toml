[project]
name = "epicurus-calendar"
version = "0.22.0"
description = "Calendar module — provider-neutral calendar capability (local + Google)."
requires-python = ">=3.11"
dependencies = [
    # The `db` extra, not bare `epicurus-core`: this service's schema is Alembic-managed
    # (#834, #928), and the runner lives behind that extra. SQLAlchemy was already declared
    # directly below, so the extra is what actually puts Alembic in the runtime image — the
    # Dockerfile installs `--package epicurus-calendar` with no extras of its own.
    "epicurus-core[db]",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_calendar"]

[tool.uv.sources]
epicurus-core = { workspace = true }
