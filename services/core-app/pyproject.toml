[project]
name = "epicurus-core-app"
version = "0.116.0"
description = "The epicurus core runtime: hosts the agent loop, LLM gateway, memory, power states, and the module-facing platform API."
requires-python = ">=3.11"
dependencies = [
    "epicurus-core",
    "fastapi>=0.141.1",
    # FastAPI needs python-multipart for UploadFile (the chat attachment upload, ADR-0019).
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.52.0",
    "litellm>=1.50",
    "httpx>=0.27",
    # mcp 2.0's transport raises httpx2 (its httpx fork with built-in SSE) exceptions; the
    # MCP host catches them to normalize module failures (#472), so the dependency is
    # declared here rather than relied on transitively through mcp.
    "httpx2>=2.9",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29",
    "qdrant-client>=1.18.0,<1.19",
    # Confirmed module removal (#127): the core stops/removes a module's own container via
    # the Docker socket through a tightly-scoped controller (ADR-0028).
    "docker>=7.0",
    # IANA timezone database for zoneinfo (the `now` tool, ADR-0039) — so timezone lookups
    # work on hosts without a system tz database (Windows dev, minimal images).
    "tzdata>=2024.1",
    # The core owns the file space (ADR-0052); aioboto3 powers the S3 FileStore backend so the
    # operator can select it (FILES_BACKEND=s3) with no separate install. Local FS is default.
    "aioboto3>=13.0",
    # Web Push send path (#670, ADR-0102): VAPID signing (RFC 8292) + the aes128gcm payload
    # encryption (RFC 8291), so the core signs/encrypts pushes itself rather than shelling out.
    "pywebpush>=2.0",
    # Pure-Python PDF text extraction (#738) — no system deps (unlike poppler/pdftotext),
    # so the attachment expander can read a PDF's text layer instead of decoding its bytes
    # as UTF-8 (mojibake).
    "pypdf>=6.14.2",
    # Mass de-index fuse metrics (#848). Already present transitively via epicurus-core
    # (which owns the /metrics route); declared directly because we import it.
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_core_app"]

[tool.uv.sources]
epicurus-core = { workspace = true }
