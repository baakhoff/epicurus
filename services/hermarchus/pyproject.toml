[project]
name = "epicurus-hermarchus"
version = "0.1.0"
description = "Hermarchus — the agent host: agent sessions behind one profile, a durable event stream, permission relay, Agent Client Protocol kinds."
requires-python = ">=3.11"
dependencies = [
    # Tenant validation (the bound profile), structured logging, /health + /metrics.
    # Deliberately *not* the `db` extra: Hermarchus keeps its own SQLite spool and versions
    # it itself (see schema.py and docs/services/hermarchus.md), so Alembic and asyncpg
    # would be dead weight in the image.
    "epicurus-core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
]

[project.scripts]
hermarchus-echo-agent = "epicurus_hermarchus.echo_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_hermarchus"]

[tool.uv.sources]
epicurus-core = { workspace = true }
