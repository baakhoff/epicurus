[project]
name = "epicurus-knowledge"
version = "0.31.0"
description = "Knowledge module — multi-project Obsidian vault index + RAG via Qdrant."
requires-python = ">=3.11"
dependencies = [
    # The `db` extra, not bare `epicurus-core`: this service's schema is Alembic-managed
    # (ADR-XXXX), and the runner lives behind that extra. SQLAlchemy was always declared
    # directly below, so the extra is what actually puts Alembic in the runtime image —
    # the Dockerfile installs `--package epicurus-knowledge` with no extras of its own.
    "epicurus-core[db]",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29",
    "qdrant-client>=1.18.0,<1.19",
    "httpx>=0.27",
    # Vault file-watcher for live re-index on external change (#232). Already present
    # transitively via uvicorn[standard]; declared directly because we import it.
    "watchfiles>=0.21",
    # Mass de-index fuse metrics (#848). Already present transitively via epicurus-core
    # (which owns the /metrics route); declared directly because we import it.
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_knowledge"]

[tool.uv.sources]
epicurus-core = { workspace = true }
