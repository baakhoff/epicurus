[project]
name = "epicurus-tasks"
version = "0.25.0"
description = "Tasks module — provider-neutral task management (Google Tasks + local store)."
requires-python = ">=3.11"
dependencies = [
    # The `db` extra, not bare `epicurus-core`: this service's schema is Alembic-managed
    # (#929, ADR-XXXX), and the runner lives behind that extra. SQLAlchemy was always
    # declared directly below, so the extra is what actually puts Alembic in the runtime
    # image — the Dockerfile installs `--package epicurus-tasks` with no extras of its own.
    "epicurus-core[db]",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_tasks"]

[tool.uv.sources]
epicurus-core = { workspace = true }
