[project]
name = "epicurus-websearch"
version = "0.3.0"
description = "Web-search module — self-hosted SearXNG + web_search MCP tool."
requires-python = ">=3.11"
dependencies = [
    "epicurus-core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "yt-dlp>=2026.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epicurus_websearch"]

[tool.uv.sources]
epicurus-core = { workspace = true }
