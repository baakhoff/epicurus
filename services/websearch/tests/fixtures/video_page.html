<!doctype html>
<!--
  A recorded-shape media page: all of the substance is in OpenGraph, and the body is the
  app shell a signed-out visitor gets. Tier 3 has to work from the head, because there is
  nothing in the body to extract — which is exactly why an article extractor alone is not
  enough for a video link.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rebuilding a 1962 Riva hull - Slipway Diaries</title>
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Rebuilding a 1962 Riva hull">
  <meta property="og:site_name" content="ClipTube">
  <meta property="og:description" content="Eleven months of frame-by-frame restoration, compressed into twenty minutes.">
  <meta property="og:image" content="https://img.cliptube.example/thumb/abc123.jpg">
  <meta property="og:video:duration" content="1215">
</head>
<body>
  <div id="app-shell"><div class="player-placeholder"></div></div>
  <script>window.__DATA__ = {};</script>
</body>
</html>
